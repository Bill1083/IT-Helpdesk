# ---------------------------------------------------------------------------
# IT Desk - Nginx reverse proxy
#
# Install to:  /etc/nginx/sites-available/it-helpdesk
# Enable with: ln -s /etc/nginx/sites-available/it-helpdesk /etc/nginx/sites-enabled/
#
# Deploy in two passes, same as your other sites:
#   1. Comment out the 443 server block and the redirect in the port 80 block,
#      reload Nginx, and run: certbot --nginx -d it.wharveytech.com
#   2. Certbot fills in the certificate paths; uncomment and reload.
#
# The container is published on 127.0.0.1:7891 (PORT in .env); 7888-7890 are
# taken by the trading dashboard, AutoMail and ScoreSage.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=ithelpdesk_login:10m rate=5r/m;

upstream ithelpdesk_app {
    server 127.0.0.1:7891;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name it.wharveytech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Comment this out during the first Certbot run.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name it.wharveytech.com;

    ssl_certificate     /etc/letsencrypt/live/it.wharveytech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it.wharveytech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Screenshots and log files are uploaded through the app.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /api/auth/login {
        limit_req zone=ithelpdesk_login burst=5 nodelay;
        proxy_pass http://ithelpdesk_app;
    }

    # Steps stream word by word: never buffer them, and allow slow "Think harder" turns.
    location ~ ^/api/problems/[^/]+/turn$ {
        proxy_pass http://ithelpdesk_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://ithelpdesk_app;
        proxy_read_timeout 120s;
    }
}
